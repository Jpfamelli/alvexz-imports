/** Fecha o pedido pela Edge Function `checkout`. Só manda variante e quantidade:
    preço, cupom, desconto Pix e frete são calculados no servidor. A resposta
    traz a URL do Stripe Checkout (Pix ou boleto) e o navegador vai para lá. */
async function finishOrderServidor(btn){
  try{
    const {data:{session}}=await SB.auth.getSession();
    if(!session) throw new Error('Sua sessão expirou. Entre de novo para finalizar.');
    const itens=State.cart.map(i=>{
      const p=CATALOG.find(x=>x.id===i.id);
      const v=(i.variantId&&p&&(p.variantes||[]).find(x=>x.id===i.variantId))||(p?variantFor(p,i.size,i.cor):null);
      if(!v) throw new Error(`${p?p.nome:'Um item'} não está mais disponível no tamanho ${i.size}.`);
      return {variant_id:v.id,quantidade:i.qtd};
    });
    const r=await fetch(CONFIG.CHECKOUT_ENDPOINT,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':CONFIG.SUPABASE_ANON_KEY},
      body:JSON.stringify({
        itens,
        endereco:{cep:CK.addr.cep,rua:CK.addr.rua,numero:CK.addr.num,complemento:CK.addr.comp,bairro:CK.addr.bairro,cidade:CK.addr.cidade,uf:CK.addr.uf},
        metodo:CK.pay,
        cupom:State.coupon?State.coupon.code:null,
        frete_id:CK.ship?CK.ship.id:'pac'
      })
    });
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.erro||'Não foi possível gerar a cobrança.');
    State.cart=[];State.coupon=null;State.shipping=null;saveCart();
    CK.step=1;CK.ship=null;
    if(d.url){ toast('Pedido criado. Abrindo o pagamento…','ok'); location.href=d.url; return; }
    toast(d.aviso||'Pedido registrado.','ok',{ms:6000});
    go('/checkout/pendente?pedido='+encodeURIComponent(d.numero||''));
  }catch(e){
    route();
    toast(e.message||'Falha ao finalizar. Tente de novo.','err',{ms:5000});
  }
}

function finishOrder(){
  /* ======================================================================
     PONTO DE INTEGRAÇÃO DO GATEWAY DE PAGAMENTO
     Em produção este bloco vira uma chamada ao SEU backend:
       const r = await fetch('/api/checkout', {method:'POST', credentials:'include',
                  headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},
                  body: JSON.stringify({items, addressId, shipping, coupon, paymentMethod, cardToken})});
     O backend (Edge Function / API route) é quem:
       1. recalcula preços e frete a partir do BANCO (nunca confia no preço vindo do front);
       2. valida estoque e reserva as unidades numa transação;
       3. cria a cobrança no gateway usando PAYMENT_API_KEY (variável de ambiente);
       4. devolve apenas o id do pedido e o payload público (QR Code / redirect URL);
       5. recebe o webhook assinado (PAYMENT_WEBHOOK_SECRET) e só então muda o status
          do pedido para "pago" e baixa o estoque definitivamente.
     NUNCA envie a chave secreta ao navegador e NUNCA confie em valores do cliente.
     ====================================================================== */
  const btn=$('#ckPay'); if(btn){btn.disabled=true;btn.innerHTML='Processando…'}

  /* Com o endpoint configurado, quem manda é o servidor: ele recalcula tudo
     do banco e cria a cobrança. Sem ele, segue a simulação local de sempre. */
  if(ONLINE&&CONFIG.CHECKOUT_ENDPOINT){ return finishOrderServidor(btn); }

  setTimeout(()=>{
    const sub=subtotal(),desc=discountValue(sub);
    const fr=(sub>=CONFIG.freeShippingFrom&&CK.ship.id!=='sedex')?0:CK.ship.preco;
    let total=Math.max(0,sub-desc)+fr;
    if(CK.pay==='pix')total=Math.max(0,sub-desc)*(1-CONFIG.pixDiscount)+fr;
    const numero='ALV-'+new Date().getFullYear()+'-'+String(1000+State.orders.length+1);
    const order={
      numero,data:Date.now(),status:'pend',
      nome:CK.ident.nome,email:CK.ident.email,pay:CK.pay,
      cupom:State.coupon?State.coupon.code:null,
      endereco:`${CK.addr.rua}, ${CK.addr.num}${CK.addr.comp?' — '+CK.addr.comp:''} · ${CK.addr.cidade}/${CK.addr.uf}`,
      frete:`${CK.ship.nome} (${CK.ship.prazo})`,total,
      itens:State.cart.map(i=>{const p=CATALOG.find(x=>x.id===i.id);return {id:i.id,nome:p.nome,size:i.size,cor:i.cor,qtd:i.qtd,preco:p.preco}}),
      rastreio:null
    };
    // baixa de estoque (em produção: transação no banco + webhook do gateway)
    State.cart.forEach(i=>{const p=CATALOG.find(x=>x.id===i.id);if(p)p.estoque[i.size]=Math.max(0,stockOf(p,i.size)-i.qtd)});
    saveCatalog();
    State.orders.unshift(order);saveOrders();
    State.cart=[];State.coupon=null;saveCart();
    CK.step=5;route();
    toast('Pedido criado com sucesso.','ok');
  },1100);
}

   A senha vai direto para o Supabase, que faz o hash. Aqui só fica a sessão,
   guardada pelo próprio supabase-js. O papel (admin) vem de profiles.role. */
async function authOnline(mode,{nome,email,senha}){
  const btn=$('#authGo'); if(btn){btn.disabled=true;btn.textContent='Aguarde…'}
  try{
    if(mode==='criar'){
      const {data,error}=await SB.auth.signUp({email,password:senha,options:{data:{nome}}});
      if(error)throw error;
      if(!data.session){
        toast('Conta criada. Confirme pelo link que enviamos ao seu e-mail e depois entre.','ok',{ms:7000});
        go('/entrar'); return;
      }
      await setUserFromSession(data.session);
      toast('Conta criada. Bem-vindo à ALVEXZ IMPORTS.','ok');
    }else{
      const {data,error}=await SB.auth.signInWithPassword({email,password:senha});
      if(error)throw error;
      await setUserFromSession(data.session);
      toast('Bem-vindo de volta.','ok');
    }
    const dest=CK.voltar?'/checkout':(isAdmin()?'/admin':'/');
    CK.voltar=false; go(dest);
  }catch(e){
    const m=String(e.message||'');
    toast(/invalid login|credentials/i.test(m)?'E-mail ou senha incorretos.'
      :(/already registered|already exists|already been registered/i.test(m)?'Este e-mail já tem conta. Use a opção de entrar.'
      :(/not confirmed/i.test(m)?'Confirme seu e-mail antes de entrar.'
      :(/rate limit/i.test(m)?'Muitas tentativas. Aguarde um minuto.'
      :(m||'Não foi possível entrar agora.')))),'err',{ms:5000});
  }finally{ if(btn){btn.disabled=false;btn.textContent=mode==='criar'?'Criar minha conta':'Entrar'} }
}
async function setUserFromSession(session){
  if(!session){State.user=null;return}
  const u=session.user;
  const {data:p}=await SB.from('profiles').select('*').eq('id',u.id).maybeSingle();
  State.user={id:u.id,nome:(p&&p.nome)||u.user_metadata?.nome||u.email.split('@')[0],email:u.email,
    admin:!!(p&&p.role==='admin'),cpf:(p&&p.cpf)||'',telefone:(p&&p.telefone)||''};
}

/* ---------- 31c. AMBIENTE: cursor e luz que seguem o mouse ---------- */
function initAmbiente(){
  const fine=window.matchMedia('(pointer:fine)').matches;
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!fine)return;
  const root=document.documentElement;
  let tx=innerWidth/2,ty=180,cx=tx,cy=ty,dx=tx,dy=ty;
  let dot=null,ring=null;
  if(!reduce){
    dot=document.createElement('div');dot.className='cur-dot';
    ring=document.createElement('div');ring.className='cur-ring';
    document.body.append(dot,ring);document.body.classList.add('cur');
  }
  window.addEventListener('pointermove',e=>{tx=e.clientX;ty=e.clientY;dx=tx;dy=ty;
    if(dot)dot.style.transform=`translate(${dx}px,${dy}px) translate(-50%,-50%)`;
    document.body.classList.remove('cur-off')},{passive:true});
  document.addEventListener('pointerleave',()=>document.body.classList.add('cur-off'));
  document.addEventListener('pointerdown',()=>ring&&ring.classList.add('down'));
  document.addEventListener('pointerup',()=>ring&&ring.classList.remove('down'));
  document.addEventListener('pointerover',e=>{
    if(!ring)return;
    const t=e.target;
    const texto=t.closest&&t.closest('input:not([type=checkbox]):not([type=range]),textarea');
    ring.classList.toggle('txt',!!texto);
    ring.classList.toggle('hov',!texto&&!!(t.closest&&t.closest('a,button,label,.card,select,[role=button],.size,.chip,.sw')));
  });
  (function loop(){
    cx+=(tx-cx)*.08; cy+=(ty-cy)*.08;
    root.style.setProperty('--mx',cx.toFixed(1)+'px'); root.style.setProperty('--my',cy.toFixed(1)+'px');
    if(ring){ const rx=ring.__x=(ring.__x??dx)+(dx-(ring.__x??dx))*.18, ry=ring.__y=(ring.__y??dy)+(dy-(ring.__y??dy))*.18;
      ring.style.transform=`translate(${rx}px,${ry}px) translate(-50%,-50%)`; }
    requestAnimationFrame(loop);
  })();
}

/* ---------- 31d. MOVIMENTO: header, reveal, botões magnéticos, paralaxe ---------- */
function initMotion(){
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fine=window.matchMedia('(pointer:fine)').matches;
  // header some descendo, volta subindo (nunca some perto do topo)
  let lastY=window.scrollY;
  window.addEventListener('scroll',()=>{
    const y=window.scrollY, h=$('#header');
    if(document.body.classList.contains('no-scroll'))return;
    if(y>lastY+6&&y>260)h.classList.add('hide'); else if(y<lastY-6||y<=260)h.classList.remove('hide');
    lastY=y;
  },{passive:true});
  if(reduce||!('IntersectionObserver' in window))return;
  // reveal: cards e blocos .rv entram quando aparecem
  document.body.classList.add('rv-on');
  const io=new IntersectionObserver(es=>{
    es.forEach(e=>{ if(!e.isIntersecting)return;
      const el=e.target, sibs=el.parentElement?[...el.parentElement.children]:[el];
      el.style.transitionDelay=((sibs.indexOf(el)%8)*45)+'ms';
      el.classList.add('in'); io.unobserve(el); });
  },{rootMargin:'0px 0px -6% 0px',threshold:.08});
  const observe=root=>(root||document).querySelectorAll('.card:not(.in),.rv:not(.in)').forEach(el=>io.observe(el));
  observe(document);
  // Segurança: se o observador não disparar (aba oculta, navegador antigo), mostra tudo.
  let ioDisparou=false;
  const chk=setInterval(()=>{ if(document.querySelector('.card.in,.rv.in')){ioDisparou=true;clearInterval(chk)} },400);
  setTimeout(()=>{ if(!ioDisparou){document.body.classList.remove('rv-on');clearInterval(chk)} },2500);
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) return; setTimeout(()=>{ if(!document.querySelector('.card.in,.rv.in')) document.body.classList.remove('rv-on') },1500) });
  new MutationObserver(()=>observe(document)).observe($('#main'),{childList:true,subtree:true});
  if(!fine)return;
  // botões magnéticos (hero e compra) + paralaxe da foto do hero
  document.addEventListener('pointermove',e=>{
    const hero=$('#hero');
    if(hero){const r=hero.getBoundingClientRect();
      if(r.bottom>0&&r.top<innerHeight){const px=(e.clientX-r.left)/r.width-.5, py=(e.clientY-r.top)/r.height-.5;
        $$('#hero .bg').forEach(img=>{img.style.transform=`scale(1.04) translate(${(-px*14).toFixed(1)}px,${(-py*10).toFixed(1)}px)`})}}
    $$('.hero-cta .btn,#addCart,#buyNow,.story-cta .btn,.insta-b').forEach(b=>{
      const r=b.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
      const dx=e.clientX-cx, dy=e.clientY-cy, d=Math.hypot(dx,dy);
      if(d<110){b.style.transform=`translate(${(dx*.22).toFixed(1)}px,${(dy*.22).toFixed(1)}px)`; b.style.transition='transform .12s'}
      else if(b.style.transform){b.style.transform='';b.style.transition='transform .5s cubic-bezier(.22,1,.36,1)'}
    });
  },{passive:true});
}

/* ---------- 32. EVENTOS GLOBAIS ---------- */
function initEvents(){
  $('#btnMenu').onclick=openMenu;
  $('#drawerX').onclick=closeMenu;
  $('#cartX').onclick=closeCart;
  $('#btnCart').onclick=openCart;
  $('#btnAccount').onclick=()=>go(State.user?(State.user.admin?'/admin':'/pedidos'):'/entrar');
  $('#scrim').onclick=()=>{closeMenu();closeCart()};
  $('#modal').onclick=e=>{if(e.target===$('#modal'))closeModal()};
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){closeMenu();closeCart();closeModal();closeSuggest()}
    if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();$('#q').focus()}
  });
  const q=$('#q');
  q.addEventListener('input',debounce(()=>renderSuggest(q.value),150));
  q.addEventListener('focus',()=>{if(q.value.trim())renderSuggest(q.value)});
  q.addEventListener('keydown',e=>{
    const items=$$('#suggest .sg-i');
    if(e.key==='Enter'){e.preventDefault();
      if(sugIndex>=0&&items[sugIndex]){go(items[sugIndex].getAttribute('href'));closeSuggest();q.blur()}
      else goSearch();return}
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();
      sugIndex=e.key==='ArrowDown'?Math.min(sugIndex+1,items.length-1):Math.max(sugIndex-1,-1);
      items.forEach((it,i)=>it.classList.toggle('sel',i===sugIndex));
      if(items[sugIndex])items[sugIndex].scrollIntoView({block:'nearest'})}
  });
  $('#sGo').onclick=goSearch;
  $('#sClear').onclick=()=>{q.value='';renderSuggest('');q.focus()};
  document.addEventListener('click',e=>{if(!e.target.closest('.searchbox'))closeSuggest()});
  // cookies
  $('#ckAccept').onclick=()=>{State.cookies={ess:true,perf:true,mkt:true};Persist.set('cookies',State.cookies);
    $('#cookieBar').classList.remove('on');toast('Preferências salvas.','ok')};
  $('#ckConfig').onclick=cookieModal;
  // scroll
  let last=0;
  window.addEventListener('scroll',()=>{
    const y=window.scrollY;
    $('#header').classList.toggle('scrolled',y>8);
    $('#toTop').classList.toggle('on',y>700);
    last=y;
  },{passive:true});
  $('#toTop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
  // newsletter
  /* Chama o backend quando NEWSLETTER_ENDPOINT estiver preenchido. Sem ele,
     um arquivo HTML sozinho não tem como enviar e-mail — então o site diz
     isso em vez de fingir que enviou. */
  async function subscribeNews(){
    const inp=$('#newsMail'), btn=$('#newsGo'), msg=$('#newsMsg');
    const v=(inp.value||'').trim();
    if(!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(v)){
      msg.style.color='#FFB3BC'; msg.textContent='Digite um e-mail válido para continuar.'; inp.focus(); return;
    }
    if(!CONFIG.NEWSLETTER_ENDPOINT){
      msg.style.color='var(--texto-2)';
      msg.textContent='E-mail anotado, mas o envio automático ainda não está ligado neste ambiente.';
      inp.value=''; toast('E-mail anotado.','info'); return;
    }
    btn.disabled=true; const rot=btn.textContent; btn.textContent='Enviando...';
    msg.style.color='var(--texto-2)'; msg.textContent='';
    try{
      const r=await fetch(CONFIG.NEWSLETTER_ENDPOINT,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email:v, origem:'rodape'})
      });
      const d=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.erro||'Não foi possível cadastrar agora.');
      msg.style.color='#8FE3C0';
      msg.textContent=d.jaInscrito
        ? 'Você já está na lista. Nada muda, continua avisado primeiro.'
        : 'Pronto! Enviamos um e-mail de confirmação. Você vai saber do próximo drop antes de todo mundo.';
      inp.value=''; toast('Cadastro feito.','ok');
    }catch(err){
      msg.style.color='#FFB3BC';
      msg.textContent=err.message||'Deu ruim no cadastro. Tenta de novo em instantes.';
    }finally{ btn.disabled=false; btn.textContent=rot; }
  }
  document.addEventListener('click',e=>{
    if(e.target.id==='newsGo'){ subscribeNews(); }
    const fh=e.target.closest('.foot-acc-h');
    if(fh&&window.innerWidth<768){
      const a=fh.parentElement,b=a.querySelector('.foot-acc-b');
      const open=a.classList.toggle('on');b.style.maxHeight=open?b.scrollHeight+'px':'0';
    }
  });
  window.addEventListener('hashchange',route);
  window.addEventListener('popstate',route);
  /* Em modo History, o clique num link interno não pode recarregar a página. */
  document.addEventListener('click',e=>{
    if(!HISTORY_MODE) return;
    const a=e.target.closest&&e.target.closest('a[href]');
    if(!a||a.target==='_blank'||a.hasAttribute('download')) return;
    if(e.metaKey||e.ctrlKey||e.shiftKey||e.button!==0) return;
    const href=a.getAttribute('href')||'';
    if(/^(https?:|mailto:|tel:|#)/i.test(href)&&!href.startsWith('#/')) return;
    const url=new URL(a.href,location.href);
    if(url.origin!==location.origin) return;
    e.preventDefault();
    go(url.pathname.replace(BASE,'')+url.search);
  });
  window.addEventListener('resize',debounce(()=>{
    if(window.innerWidth>=768)$$('.foot-acc-b').forEach(b=>b.style.maxHeight='');
  },200));
}

/* ---------- 33. TOPBAR ---------- */
function initTopbar(){
  const msgs=[
    `<b>FRETE GRÁTIS</b> acima de ${BRL(CONFIG.freeShippingFrom)}`,
    `<b>7% OFF</b> pagando no Pix`,
    `<b>PEÇAS ORIGINAIS</b>`,
    `<b>PEÇAS IMPORTADAS</b>`,
    `<b>USE O CUPOM BEMVINDOS5</b>`
  ];
  const line=msgs.map(m=>`<span>${m}</span>`).join('');
  $('#topbarTrack').innerHTML=line+line;
}

/* ---------- 34. BOOT ---------- */
(async function init(){
  await Persist.init();
  loadBrandLogos();
  /* Modo banco: só vira ONLINE se o catálogo do Supabase carregar de verdade.
     Qualquer falha (sem rede, chave errada, projeto pausado) cai no modo local
     e a loja continua abrindo, com aviso no console. */
  if(SB){
    try{ await loadCatalog(); ONLINE=true; }
    catch(e){ console.warn('Supabase indisponível, usando catálogo local:',e.message); }
  }
  if(!ONLINE){
    const saved=Persist.get('catalog',null);
    seedCatalog();
    if(saved&&saved.CATALOG&&saved.CATALOG.length){
      CATALOG=saved.CATALOG;BANNERS=saved.BANNERS||BANNERS;COUPONS=saved.COUPONS||COUPONS;
    }
  }
  State.cart=Persist.get('cart',[]).filter(i=>CATALOG.some(p=>p.id===i.id));
  State.fav=Persist.get('fav',[]).filter(id=>CATALOG.some(p=>p.id===id));
  if(ONLINE){
    try{
      const {data:{session}}=await SB.auth.getSession();
      await setUserFromSession(session);
    }catch(e){ console.warn('sessão',e.message); }
    SB.auth.onAuthStateChange((ev,s)=>{
      setTimeout(async()=>{
        if(ev==='SIGNED_OUT'){State.user=null;State.orders=[];renderDrawer();return}
        if(ev==='SIGNED_IN'&&s&&(!State.user||State.user.id!==s.user.id)){await setUserFromSession(s);renderDrawer()}
      },0);
    });
    State.orders=[];
  }else{
    State.user=Persist.get('user',null);
    State.orders=Persist.get('orders',[]);
  }
  State.cookies=Persist.get('cookies',null);
  State.recent=Persist.get('recent',[]);
  initTopbar();renderFooter();initEvents();paintBadges();initAmbiente();initMotion();
  window.addEventListener('load',bindBrandLogos);
  /* Cada render troca innerHTML. Em vez de chamar normalizeLinks em vinte
     lugares, um observador cuida de tudo que entra no DOM. */
  if(HISTORY_MODE){
    let agendado=false;
    new MutationObserver(()=>{
      if(agendado)return; agendado=true;
      requestAnimationFrame(()=>{agendado=false;normalizeLinks(document)});
    }).observe(document.documentElement,{childList:true,subtree:true});
    normalizeLinks(document);
  }
  if(!HISTORY_MODE&&!location.hash)location.hash='#/';
  route();
  if(!State.cookies)setTimeout(()=>$('#cookieBar').classList.add('on'),1400);
  console.info('%cALVEXZ IMPORTS','background:#111114;color:#fff;padding:3px 8px;border-radius:4px;font-weight:700',
    `loja carregada / ${ONLINE?'banco Supabase':'modo local ('+Persist.mode+')'} / ${CATALOG.length} produtos`);
})();
</script>
